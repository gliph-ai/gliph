# The Xcode project is generated, not committed: a .pbxproj is a merge-conflict
# machine and nobody reads one. `xcodegen` turns this into mobile/Gliph.xcodeproj,
# and the build scripts run it themselves.

name: Gliph
options:
  bundleIdPrefix: chat.gliph
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# WebRTC for DM transfers (P2P.swift): the browser's own stack, built for iOS,
# so an iPhone and a desktop speak the same data channel. A binary package.
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 157.0.0

settings:
  base:
    DEVELOPMENT_TEAM: KF53B4S5HD
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Empty in a dev build: the sign-in screen asks for an address. The deploy
    # scripts pass a real one.
    GLIPH_SERVER: ""

targets:
  Gliph:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # XcodeGen has no separate `resources:` key — it assigns a build phase per
      # file type, so the asset catalog and the launch storyboard belong here.
      # Without them the app runs letterboxed with no icon.
      - path: Resources
      - path: Generated/gliph_core.swift
        # UniFFI's output; regenerated by tools/build-core.sh and not committed.
        optional: true
    dependencies:
      - framework: GliphCore.xcframework
        embed: false
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.gliph.mobile
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Gliph.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Wi-Fi Aware and its pairing sheet exist from iOS 26; the app runs on
        # 16. Weak, or dyld refuses to launch it on anything older.
        OTHER_LDFLAGS: "$(inherited) -weak_framework WiFiAware -weak_framework DeviceDiscoveryUI -weak_framework _DeviceDiscoveryUI_SwiftUI"
        # NOT SWIFT_INCLUDE_PATHS: the XCFramework already carries the headers
        # and their module.modulemap, and pointing at the same directory twice
        # makes clang report the module as redefined.
    preBuildScripts:
      - name: Build gliph-core
        # The Rust core and its Swift bindings are build artifacts, so Xcode
        # makes them rather than trusting a checked-in copy to be current.
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          "$SRCROOT/tools/build-core.sh"
        basedOnDependencyAnalysis: false
