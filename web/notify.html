<!doctype html>
<html lang="en" data-theme="creme">
  <head>
    <meta charset="utf-8">
    <!-- The same backstop index.html carries, minus everything this page cannot
         do: no links are rendered here, so there is no media surface at all. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src *; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="/fonts/g/fonts.css">
    <!-- The desktop notification window. Nobody navigates here: the app creates
         it (web/src/notify.ts), pins it to the top right of the screen, and
         keeps it alive hidden between alerts. -->
  </head>
  <body class="notifywin">
    <div id="stack"></div>
    <script type="module" src="/src/notifywin.ts"></script>
  </body>
</html>
